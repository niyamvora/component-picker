<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component Picker rebuild self-check</title>
<!-- The v2.0 page export (#124), exercised on a page written for it: every technique the resend.com
     analysis found, built from scratch. check.sh runs every test/fixture*.html. -->
<style>
  @layer base, components;
  /* #114 — nesting that must survive verbatim, and rules that must not */
  @layer components { @media (min-width: 768px) { @supports (display: grid) { .lms { display: grid; } } } }
  .never-used-anywhere { color: red; }
  .btn { animation: used-spin 1s linear infinite; }
  .btn:hover { color: rgb(1, 2, 3); }
  html.dark .panel { background: black; }
  :root { --brand: rgb(10, 20, 30); }
  .logo { background-image: url("img/logo.png"); }
  @keyframes used-spin { to { transform: rotate(1turn); } }
  @keyframes unused-fade { to { opacity: 0; } }
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @property --unused-prop { syntax: "<length>"; inherits: false; initial-value: 0px; }
  .ring { background: linear-gradient(var(--angle), red, blue); }
  .panel { container-type: inline-size; }
  @container (min-width: 300px) { .panel p { padding: 8px; } }
  @media print { .btn { display: none; } }
  /* #118 — every way a page references a file */
  .bg-hero { background-image: url("img/hero.jpg"); background-size: cover; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; z-index: -1; }
  .deco::before { content: ""; display: inline-block; width: 10px; height: 10px; background-image: url("img/before.png"); }
  .masked { display: inline-block; width: 16px; height: 16px; mask-image: url("img/mask.svg"); -webkit-mask-image: url("img/mask.svg"); background: black; }
  .tex { background: url("img/texture-noise.png") repeat; }
  @font-face { font-family: "Fixture Sans"; src: url("fonts/fixture-sans.woff2") format("woff2"); }
  main { font-family: "Fixture Sans", sans-serif; }
  /* The files do not exist, and a broken <img> renders as inline alt text ignoring width/height;
     inline-block keeps the declared box, which is what a loaded image would have. */
  main img { display: inline-block; }
  /* #116 — matches only while the menu is open */
  .menu-item { color: rgb(9, 9, 9); }
</style>
<link rel="icon" href="img/favicon.png">
<main>
  <div class="lms">layer, media, supports</div>
  <button class="btn">Go</button>
  <div class="panel"><p>panel</p></div>
  <div class="ring logo">ring</div>
  <!-- #115 — a closed tab panel, responsive image, inline handler and shadow root that must all survive -->
  <section id="tabs-demo">
    <div role="tablist">
      <button role="tab" id="t1" aria-selected="true" aria-controls="p1" data-state="active">One</button>
      <button role="tab" id="t2" aria-selected="false" aria-controls="p2" data-state="inactive">Two</button>
      <a role="tab" id="t3" href="/elsewhere" aria-selected="false">Away</a>
    </div>
    <div role="tabpanel" id="p1">First panel text</div>
    <div role="tabpanel" id="p2" hidden>Second panel secret text</div>
  </section>
  <img class="pic" src="img/a.png" srcset="img/a.png 1x, img/a@2x.png 2x" alt="A">
  <button class="handler" onclick="void 0" nonce="abc">handler</button>
  <shadow-card></shadow-card>
  <div id="many"></div>
  <div class="bg-hero"></div>
  <span class="deco">deco</span>
  <span class="masked"></span>
  <div class="tex">texture</div>
  <video class="clip" poster="img/poster.jpg" muted loop playsinline width="320" height="180"><source src="media/clip.mp4" type="video/mp4"></video>
  <img class="avatar" src="img/avatars/jane.jpg" alt="Jane Doe" width="40" height="40" style="border-radius:50%">
  <img class="shot" src="img/screenshot.png" alt="Dashboard" width="400" height="240">
  <div class="logos"><img src="img/logo-acme.png" alt="Acme" width="80" height="24"><img src="img/logo-acme.png" alt="Acme" width="80" height="24"><img src="img/logo-acme.png" alt="Acme" width="80" height="24"></div>
  <!-- #119 — the same drawing twice (placement differs), a different drawing under the same name, and an unlabelled one -->
  <svg class="one" aria-label="Acme" role="img" viewBox="0 0 10 10" width="16" height="16"><rect width="10" height="10"></rect></svg>
  <svg class="two" aria-label="Acme" role="img" viewBox="0 0 10 10" width="24" height="24" data-x="1"><rect width="10" height="10"></rect></svg>
  <svg aria-label="Acme" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"></circle></svg>
  <svg viewBox="0 0 4 4"><path d="M0 0h4v4z"></path></svg>
  <!-- #117 — motion written by script, which getAnimations() cannot see -->
  <div id="rafbox" style="opacity: 0">raf</div>
  <ul id="log"></ul>
  <!-- #116 — a disclosure, and a menu that mounts its popup outside the trigger -->
  <details id="faq"><summary>Question?</summary><p>Answer text</p></details>
  <button id="menu" aria-haspopup="menu" aria-expanded="false">Menu</button>
  <!-- #121 — two elements whose change moves nothing else, so the diff can be exact -->
  <div id="fp-a" style="position:absolute; left:0; top:0; width:100px; height:20px; overflow:hidden; font-size:14px">Fingerprint A</div>
  <div id="fp-b" style="display:flex; gap:8px; width:100px; height:20px"><span>only</span></div>
</main>
<script>
  customElements.define("shadow-card", class extends HTMLElement {
    connectedCallback() { this.attachShadow({ mode: "open" }).innerHTML = '<p class="inside">shadow text</p>'; }
  });
  // #115 — more elements than the 300 a section capture keeps
  for (let i = 0; i < 400; i++) document.getElementById("many").appendChild(Object.assign(document.createElement("div"), { className: "many-item", textContent: String(i) }));
  // #117 — a 1s opacity sawtooth written frame by frame, and a row prepended every 500ms. Both stop
  // once the motion test is done, so later tests see a still page. The frames come from a 16ms timer,
  // not requestAnimationFrame: under check.sh's --dump-dom virtual time rAF fires twice in 2.6s while
  // timers fire normally. The recorder observes the style writes whatever schedules them; the real
  // rAF path is exercised in the extension e2e, where frames actually render.
  const rafbox = document.getElementById("rafbox"), loopStart = performance.now();
  const frameTimer = setInterval(() => {
    if (window.__stopFixtureMotion) return clearInterval(frameTimer);
    rafbox.style.opacity = (((performance.now() - loopStart) % 1000) / 1000).toFixed(2);
  }, 16);
  // #116 — the tab set and the menu behave the way their ARIA says
  for (const tab of document.querySelectorAll('#tabs-demo button[role="tab"]')) {
    tab.addEventListener("click", () => {
      for (const t of document.querySelectorAll('#tabs-demo button[role="tab"]')) {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        t.dataset.state = on ? "active" : "inactive";
        document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      }
    });
  }
  const menu = document.getElementById("menu");
  menu.addEventListener("click", () => {
    const open = menu.getAttribute("aria-expanded") === "true";
    menu.setAttribute("aria-expanded", String(!open));
    if (open) return document.getElementById("menu-pop")?.remove();
    const pop = document.createElement("div");
    pop.id = "menu-pop";
    pop.setAttribute("role", "menu");
    pop.innerHTML = '<a class="menu-item" href="#a">Item A</a>';
    document.body.appendChild(pop);
  });
  const logTimer = setInterval(() => {
    if (window.__stopFixtureMotion) return clearInterval(logTimer);
    document.getElementById("log").prepend(Object.assign(document.createElement("li"), { className: "log-row", textContent: "HTTP 200" }));
  }, 500);
  // In export mode nothing stops the loops but the export itself: its motion phase records them, and
  // its first state-sweep click ends them, so the markup and fingerprints after it see a still page.
  if (new URLSearchParams(location.search).has("export")) {
    document.addEventListener("click", () => { window.__stopFixtureMotion = true; }, { once: true, capture: true });
  }
</script>
<pre id="result">RUNNING</pre>
<script>window.__cpNoAutostart = true;</script>
<script src="../dist/picker.js"></script>
<script>
  (async () => {
    // test/export.e2e.mjs opens this page with ?export and runs the real export against it instead.
    if (new URLSearchParams(location.search).has("export")) return;
    const fails = [];
    const expect = (ok, msg) => { if (!ok) fails.push(msg); };
    const rb = window.__cp.rebuild;

    // #114 — the page's own rules, verbatim and nested, cut to what the page can use
    const used = rb.usedCss();
    const css = used.css;
    const sheetBytes = [...document.styleSheets].reduce((n, s) => n + [...s.cssRules].map((r) => r.cssText).join("\n").length, 0);
    expect(/@layer components \{\s*@media \(min-width: 768px\) \{\s*@supports \(display: grid\) \{\s*\.lms \{ display: grid; \}/.test(css), "#114 @layer/@media/@supports nesting was not kept in order");
    expect(css.includes("@layer base, components;"), "#114 the @layer order statement was dropped");
    expect(!css.includes("never-used-anywhere"), "#114 a rule matching nothing was kept");
    expect(css.includes(".btn:hover { color: rgb(1, 2, 3); }"), "#114 a :hover rule for an existing element was dropped");
    expect(css.includes("html.dark .panel"), "#114 a dark-theme rule was dropped because the theme is not active");
    expect(css.includes(":root { --brand: rgb(10, 20, 30); }"), "#114 :root tokens were dropped");
    expect(css.includes(`url("${new URL("img/logo.png", location.href).href}")`), "#114 a relative url() was not absolutized");
    expect(css.includes("@keyframes used-spin") && !css.includes("unused-fade"), "#114 keyframes were not filtered to the used ones");
    expect(/@property --angle/.test(css) && !css.includes("--unused-prop"), "#114 @property was not filtered to the referenced ones");
    expect(css.includes("@media print"), "#114 print rules were dropped");
    expect(used.breakpoints.includes("@media (min-width: 768px)") && used.breakpoints.includes("@container (min-width: 300px)")
      && !used.breakpoints.some((b) => b.includes("print")), "#114 breakpoints wrong: " + JSON.stringify(used.breakpoints));
    expect(used.unreadable.length === 0 && used.kept > 0 && used.kept < used.total, "#114 stats wrong: " + JSON.stringify({ ...used, css: undefined }));
    const cross = rb.usedCss(document, [{ href: "https://cdn.example/x.css", text: ".btn { margin: 1px; } .nope-x { color: red; }" }]).css;
    expect(cross.includes("/* https://cdn.example/x.css (read through the debugger) */") && cross.includes(".btn { margin: 1px; }")
      && !cross.includes("nope-x"), "#114 sheet text supplied by the caller was not filtered and labelled");
    expect(rb.atRest(".group-data-\\[open\\]\\:x:is(:where(.group)[data-open] *)") === ".group-data-\\[open\\]\\:x"
      && rb.atRest("html.dark .card:hover::before") === "html .card" && rb.atRest(".a > :focus-visible") === ".a",
      "#114 atRest did not strip state, theme and attribute parts correctly");

    // #115 — the whole page as one document, uncapped, runnable code removed
    const dom = rb.exportDom();
    const page = dom.html;
    const absUrl = (u) => new URL(u, location.href).href;
    expect((page.match(/class="many-item"/g) || []).length === 400 && dom.elements > 400, "#115 not every element was exported: " + dom.elements);
    expect(page.includes("Second panel secret text") && page.includes('aria-selected="false"') && page.includes('data-state="inactive"'), "#115 a closed tab panel, ARIA or data-state was lost");
    expect(!/<script|onclick=|nonce=/.test(page), "#115 a script, handler or nonce survived");
    expect(page.startsWith("<!doctype html>") && page.includes('<html lang="en">') && page.includes("<title>Component Picker rebuild self-check</title>")
      && page.includes('<link rel="stylesheet" href="styles.css">'), "#115 the head is not a standalone document linking styles.css");
    expect(page.includes(`srcset="${absUrl("img/a.png")} 1x, ${absUrl("img/a@2x.png")} 2x"`), "#115 srcset was not kept with absolute URLs");
    expect(page.includes('<template shadowrootmode="open"><p class="inside">shadow text</p></template>'), "#115 the open shadow root was not kept as a declarative template");
    expect(page.includes('<meta charset="utf-8">') && !page.includes("http-equiv"), "#115 the charset meta is missing or malformed");
    const mapped = rb.exportDom({ stylesheet: "", mapUrl: (u) => u.endsWith("/img/a.png") ? "assets/media/a.png" : u }).html;
    expect(mapped.includes('src="assets/media/a.png"') && !mapped.includes('rel="stylesheet"'), "#115 mapUrl or stylesheet option ignored");

    // #118 — the inventory: every reference, one entry per file, with a role
    const manifest = rb.buildManifest(rb.assetRefs(), [], innerWidth, innerHeight);
    const entry = (path) => manifest.find((e) => e.url === absUrl(path));
    const roles = { "img/hero.jpg": "decorative-background", "img/before.png": "icon", "img/mask.svg": "icon",
      "img/texture-noise.png": "texture", "media/clip.mp4": "video", "img/poster.jpg": "poster", "img/favicon.png": "favicon",
      "fonts/fixture-sans.woff2": "font", "img/avatars/jane.jpg": "avatar", "img/screenshot.png": "content-image", "img/logo-acme.png": "logo" };
    for (const [path, role] of Object.entries(roles)) {
      expect(entry(path)?.role === role, `#118 ${path}: expected ${role}, got ${entry(path)?.role ?? "no entry"}`);
    }
    expect(entry("img/logo-acme.png")?.usedBy.length === 3 && manifest.filter((e) => e.url === absUrl("img/logo-acme.png")).length === 1, "#118 a file used 3 times is not one entry with 3 uses");
    expect(entry("img/a.png")?.variants?.includes(absUrl("img/a@2x.png")) && !entry("img/a@2x.png"), "#118 srcset candidates are not folded into their image");
    expect(entry("img/before.png")?.usedBy[0].endsWith("::before"), "#118 a pseudo-element background is not attributed to its pseudo-element");
    expect(manifest.every((e) => !e.local && e.bytes === undefined && e.source === "dom"), "#118 manifest mode must not carry bytes or local paths");
    const secondLogo = document.querySelectorAll(".logos img")[1];
    expect(document.querySelector(rb.cssPath(secondLogo)) === secondLogo && document.querySelector(rb.cssPath(document.getElementById("p2"))) === document.getElementById("p2"),
      "#118 cssPath does not resolve back to the element it names");
    const joined = rb.buildManifest(rb.assetRefs(), [
      { url: absUrl("img/hero.jpg"), type: "Image", mime: "image/jpeg", bytes: 1234 },
      { url: absUrl("fonts/late.woff2"), type: "Font", mime: "font/woff2", bytes: 99 },
      { url: absUrl("app.css"), type: "Stylesheet", mime: "text/css", bytes: 5 },
    ], innerWidth, innerHeight);
    const late = joined.find((e) => e.url === absUrl("fonts/late.woff2"));
    expect(joined.find((e) => e.url === absUrl("img/hero.jpg"))?.bytes === 1234 && joined.find((e) => e.url === absUrl("img/hero.jpg"))?.source === "dom+network"
      && late?.role === "font" && late?.source === "network" && late?.usedBy.length === 0 && !joined.some((e) => e.url === absUrl("app.css")),
      "#118 the network join lost bytes, a network-only font, or kept a stylesheet as media");

    // #119 — media as code first: SVG files, a gradient from an image's colours, stand-ins per role
    const svgs = rb.inlineSvgs();
    const acme = svgs.filter((s) => s.name.startsWith("acme"));
    const acmeFile = acme.find((s) => s.name === "acme");
    expect(acme.length === 2 && acmeFile?.usedBy.length === 2 && acme.some((s) => s.name === "acme-2" && s.usedBy.length === 1),
      "#119 SVG dedupe or naming wrong: " + JSON.stringify(acme.map((s) => [s.name, s.usedBy.length])));
    expect(acmeFile?.path === "assets/svg/acme.svg" && acmeFile.markup.startsWith("<svg") && acmeFile.markup.includes('xmlns="http://www.w3.org/2000/svg"')
      && !/class=|aria-label=|role=|width="16"/.test(acmeFile.markup) && acmeFile.markup.includes('viewBox="0 0 10 10"'),
      "#119 the SVG file is not clean standalone markup: " + acmeFile?.markup);
    expect(svgs.some((s) => /^icon-[0-9a-f]{8}$/.test(s.name)), "#119 an unlabelled SVG was not named by its hash");
    const px = Object.assign(document.createElement("canvas"), { width: 2, height: 1 });
    const pctx = px.getContext("2d");
    pctx.fillStyle = "#ff0000"; pctx.fillRect(0, 0, 1, 1);
    pctx.fillStyle = "#0000ff"; pctx.fillRect(1, 0, 1, 1);
    const pal = rb.paletteOf(pctx.getImageData(0, 0, 2, 1).data, 2, 1);
    expect(pal.colors.includes("#ff0000") && pal.colors.includes("#0000ff") && pal.css === "linear-gradient(90deg, #ff0000 0%, #0000ff 100%)",
      "#119 palette of a red|blue image wrong: " + JSON.stringify(pal));
    const ctx = { svgs, video: rb.videoFacts()[absUrl("media/clip.mp4")], origin: location.origin };
    const sub = (path) => rb.substitute(entry(path), ctx);
    expect(sub("img/avatars/jane.jpg").initials === "JD", "#119 avatar initials wrong: " + JSON.stringify(sub("img/avatars/jane.jpg")));
    expect(sub("img/logo-acme.png").svg === "assets/svg/acme.svg", "#119 a logo with a matching inline SVG does not point at it");
    expect(sub("img/screenshot.png").aspectRatio === "400 / 240" && sub("img/screenshot.png").alt === "Dashboard", "#119 content-image stand-in wrong: " + JSON.stringify(sub("img/screenshot.png")));
    const clip = sub("media/clip.mp4");
    expect(clip.loop === true && clip.muted === true && clip.autoplay === false && /no code source/.test(clip.note) && clip.aspectRatio === "320 / 180",
      "#119 video facts wrong: " + JSON.stringify(clip));
    const font = sub("fonts/fixture-sans.woff2");
    expect(font.selfHosted === true && font.faces[0] === "Fixture Sans 400 normal", "#119 font facts wrong: " + JSON.stringify(font));

    // #117 — the recorder turns script writes into a period, keyframes and a stream
    rb.motion.start(document.body);
    await new Promise((r) => setTimeout(r, 2600));
    const rec = rb.motion.stop();
    window.__stopFixtureMotion = true;
    const op = rec.tracks.find((t) => t.selector === rb.cssPath(rafbox) && t.property === "opacity");
    expect(op && Math.abs(op.period - 1000) <= 100 && /0% \{ opacity: [\d.]+; \}/.test(op.keyframes) && op.keyframes.includes("infinite"),
      "#117 the rAF opacity loop was not reported with a ~1000ms period: " + JSON.stringify(op && { period: op.period, n: op.samples.length, keyframes: op.keyframes }));
    const stream = rec.streams.find((s) => s.selector === rb.cssPath(document.getElementById("log")));
    expect(stream && stream.position === "prepend" && Math.abs(stream.every - 500) <= 60 && stream.template.includes('<li class="log-row">HTTP 200</li>') && stream.count >= 4,
      "#117 the prepend stream was not reported every ~500ms: " + JSON.stringify(stream));
    expect(rec.animations.filter((a) => a.name === '"used-spin"').length === 1 && !rec.tracks.some((t) => t.selector.includes("button")),
      "#117 the CSS animation was not reported exactly once, from getAnimations: " + JSON.stringify(rec.animations.map((a) => a.name)));
    expect(rb.motion.stop() === null, "#117 a second stop must return null, not a stale recording");
    expect(rb.motion.periodOf([[0, "0"], [250, "0.5"], [500, "0"], [750, "0.5"], [1000, "0"]]) === 500, "#117 periodOf wrong on a clean 500ms cycle");

    // #116 — the state sweep: every tab, disclosure and menu opened, recorded, and put back
    expect(!rb.usedCss().css.includes(".menu-item"), "#116 precondition: the menu's rule is dropped while the menu is closed");
    const triggers = rb.sweep.discover();
    expect(triggers.length === 3 && triggers.some((t) => t.label === "Two" && t.kind === "tab")
      && triggers.some((t) => t.label === "Question?" && t.kind === "summary") && triggers.some((t) => t.label === "Menu" && t.kind === "disclosure")
      && !triggers.some((t) => ["One", "Away"].includes(t.label)), "#116 wrong triggers: " + JSON.stringify(triggers));
    const states = {};
    for (const t of triggers) {
      rb.sweep.begin(t.index);
      document.querySelector(t.mark).click(); // the extension clicks through the debugger; the page side is the same
      await new Promise((r) => setTimeout(r, 30));
      states[t.label] = rb.sweep.end();
      const undo = rb.sweep.restore();
      if (undo === "escape") document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      else if (undo) document.querySelector(undo.selector).click();
      await new Promise((r) => setTimeout(r, 30));
    }
    rb.sweep.clear();
    expect(states.Two?.revealed.some((r) => r.text.includes("Second panel secret text"))
      && states.Two.attributes.some((a) => a.selector === "#t2" && a.name === "aria-selected" && a.from === "false" && a.to === "true"),
      "#116 the tab state is incomplete: " + JSON.stringify(states.Two));
    expect(states["Question?"]?.attributes.some((a) => a.selector === "#faq" && a.name === "open" && a.from === null)
      && states["Question?"].revealed.some((r) => r.text.includes("Answer text")), "#116 the details state is incomplete: " + JSON.stringify(states["Question?"]));
    expect(states.Menu?.added.some((h) => h.includes('role="menu"') && h.includes("Item A")), "#116 the portal-mounted menu was not recorded: " + JSON.stringify(states.Menu));
    expect(document.getElementById("t1").getAttribute("aria-selected") === "true" && document.getElementById("p2").hidden
      && !document.getElementById("faq").open && !document.getElementById("menu-pop"), "#116 the page was not restored to its default state");
    expect(!document.querySelector("[data-cp-trigger]"), "#116 trigger marks were left on the page");
    expect(rb.usedCss().css.includes(".menu-item { color: rgb(9, 9, 9); }"), "#116 a rule that only matches while the menu is open was not kept");

    // #121 — the layout fingerprint and its diff: how a rebuild is checked instead of with a screenshot
    const fpA = document.getElementById("fp-a"), fpB = document.getElementById("fp-b");
    const original = rb.fingerprint();
    const self = rb.compareFingerprints(original, rb.fingerprint());
    expect(self.mismatches.length === 0 && self.missing === 0 && self.extra === 0 && self.matched === original.nodes.length,
      "#121 the page against itself is not a clean match: " + JSON.stringify({ ...self, mismatches: self.mismatches.slice(0, 5) }));
    expect(original.nodes.length > 400 && original.nodes.every((n) => n.box[2] > 0 && n.box[3] > 0), "#121 the fingerprint is missing visible elements");
    fpA.style.fontSize = "20px";
    fpB.style.gap = "24px";
    const changed = rb.compareFingerprints(original, rb.fingerprint());
    fpA.style.fontSize = "14px";
    fpB.style.gap = "8px";
    expect(changed.mismatches.length === 2
      && changed.mismatches.some((m) => m.message === 'div "Fingerprint A" (#fp-a): font-size: 20px, original 14px')
      && changed.mismatches.some((m) => m.message === "div (#fp-b): gap: 24px, original 8px"),
      "#121 a font-size and a gap change did not produce exactly those two mismatches: " + JSON.stringify(changed.mismatches.slice(0, 6)));
    const cut = rb.compareFingerprints(original, { ...original, nodes: original.nodes.filter((n) => n.path !== "#fp-a") });
    expect(cut.missing === 1 && cut.mismatches[0]?.message === 'Missing: div "Fingerprint A" (#fp-a)', "#121 a removed element was not reported missing: " + JSON.stringify(cut.mismatches.slice(0, 3)));

    // #120 — the page-side steps of the export, and the README written from what ran
    const tokens = rb.tokens();
    expect(tokens.color?.brand?.$value === "rgb(10, 20, 30)" && !Object.keys(tokens.other ?? {}).some((k) => k.startsWith("tw-")), "#120 :root tokens wrong: " + JSON.stringify(tokens));
    const scrolled = rb.scrollTo(0);
    expect(scrolled.y === 0 && scrolled.height >= scrolled.viewport && scrolled.viewport > 0, "#120 scrollTo wrong: " + JSON.stringify(scrolled));
    expect(rb.pageInfo().title === "Component Picker rebuild self-check" && rb.outline().some((o) => o.selector === "#tabs-demo" && o.elements > 0), "#120 page info or outline wrong: " + JSON.stringify(rb.outline().slice(0, 4)));
    expect(rb.exportDomMapped({ [absUrl("img/a.png")]: "assets/media/a.png" }).html.includes('src="assets/media/a.png"'), "#120 exportDomMapped did not apply the URL map");
    const readme = rb.readme({
      title: "Demo", url: "https://demo.example/", at: "2026-09-15T00:00:00.000Z", widths: [1440, 768, 390], media: "manifest",
      elements: 2434, css: { kept: 1709, total: 11473, breakpoints: ["@media (min-width: 40rem)"] },
      manifest: [{ url: "https://demo.example/a.png", role: "avatar", usedBy: ["img"], source: "dom" }, { url: "https://demo.example/b.png", role: "avatar", usedBy: ["img"], source: "dom" }, { url: "https://demo.example/c.mp4", role: "video", usedBy: ["video"], source: "dom" }],
      svgs: 98, states: [{ file: "states/01-two.json", label: "Two", kind: "tab" }], motion: null,
      outline: [{ heading: "Pricing", selector: "#pricing", elements: 40 }], notes: ["Could not read 1 stylesheet(s): https://cdn.example/x.css"], files: ["index.html", "styles.css"],
    });
    expect(readme.startsWith("# Rebuild export: Demo") && readme.includes("no screenshots") && readme.includes("1709 of 11473 rules")
      && readme.includes("3 files (2 avatar, 1 video)") && readme.includes("1 state opened by clicking") && readme.includes("not recorded")
      && readme.includes("**Pricing** — `#pricing`") && readme.includes("- Could not read 1 stylesheet(s)") && readme.includes("- README.md")
      && readme.includes("1440 / 768 / 390px"), "#120 the README does not reflect its input:\n" + readme);

    document.getElementById("result").textContent = fails.length ? "FAIL\n" + fails.join("\n") : "PASS rebuild";
  })().catch((e) => { document.getElementById("result").textContent = "FAIL " + e.stack; });
